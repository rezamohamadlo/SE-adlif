hydra:
  run:
    dir: results/phase1_models/corrected/reference/SSC/seed_123
  sweep:
    dir: ${logdir}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    root: null
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=results/phase1_models/corrected/reference/SSC/seed_123
    - hydra.mode=RUN
    task:
    - experiment=SSC_SE_adLIF
    - random_seed=123
    - n_epochs=40
    - batch_size=256
    - dataset.batch_size=256
    - logdir=results/phase1_models/corrected/reference/SSC/seed_123
    - dataset.num_workers=0
    - early_stopping=False
    - early_stopping_patience=50
    - early_stopping_min_delta=0.001
    - patience=9999
    - factor=0.9
  job:
    name: run
    chdir: true
    override_dirname: batch_size=256,dataset.batch_size=256,dataset.num_workers=0,early_stopping=False,early_stopping_min_delta=0.001,early_stopping_patience=50,experiment=SSC_SE_adLIF,factor=0.9,logdir=results/phase1_models/corrected/reference/SSC/seed_123,n_epochs=40,patience=9999,random_seed=123
    id: ???
    num: ???
    config_name: main
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: E:\AI_paper_nazari\SE-adlif
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: E:\AI_paper_nazari\SE-adlif\config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: E:\AI_paper_nazari\SE-adlif\results\phase1_models\corrected\reference\SSC\seed_123
    choices:
      experiment: SSC_SE_adLIF
      dataset: ssc
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: none
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false

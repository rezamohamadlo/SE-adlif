_target_: datasets.shd.SHDLDM
data_path: ${datadir}
spatial_factor: 0.2
time_factor: 0.001
pad_to_min_size: 250
window_size: 4
batch_size: 256
num_workers: 8
num_classes: 20
# Select checkpoints on held-out training data, not on the official test set.
validate_on: 0.2
random_seed: 42
# Keep split/preprocessing caches separate from legacy test-validation runs.
cache_namespace: controlled_v2
ignore_first_timesteps: 10

# @package _global_
# Reproduce the documented two-layer SHD* settings separately from controlled_v2.
defaults:
  - SHD_SE_adLIF
  - /paper_baseline
  - _self_

exp_name: SHD_SE_adLIF_paper
evaluation_protocol: paper_shd_reproduction
paper_baseline_version: ${paper_baseline.version}

n_epochs: ${paper_baseline.datasets.SHD.n_epochs}
batch_size: ${paper_baseline.datasets.SHD.batch_size}
lr: ${paper_baseline.datasets.SHD.lr}
dropout: ${paper_baseline.common.dropout}
# Table 7 specifies 300 training epochs. Complete that budget and select the
# best validation epoch, rather than applying our added early-stopping rule.
early_stopping: ${paper_baseline.reproduction_policy.early_stopping}
scheduler: ${paper_baseline.reproduction_policy.scheduler}
patience: ${paper_baseline.reproduction_policy.patience}
factor: ${paper_baseline.reproduction_policy.factor}
gradient_clip_val: ${paper_baseline.common.gradient_clip_val}
ckpt_path: null
init_ckpt_path: null
run_test: true

dataset:
  batch_size: ${paper_baseline.datasets.SHD.batch_size}
  num_workers: ${paper_baseline.reproduction_policy.num_workers}
  validate_on: ${paper_baseline.datasets.SHD.validate_on}
  random_seed: ${paper_baseline.reproduction_policy.split_seed}
  cache_namespace: ${paper_baseline.reproduction_policy.cache_namespace}
  spatial_factor: ${paper_baseline.datasets.SHD.spatial_factor}
  time_factor: ${paper_baseline.datasets.SHD.time_factor}
  window_size: ${paper_baseline.datasets.SHD.window_size}
  pad_to_min_size: ${paper_baseline.datasets.SHD.pad_to_min_size}
  ignore_first_timesteps: ${paper_baseline.datasets.SHD.ignore_first_timesteps}
  additional_test_set_validation: false

logdir: ./results/experiments/shd_paper/seed_${random_seed}
hydra:
  sweep:
    dir: ./results/experiments/shd_paper/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: seed_${random_seed}

# @package _global_
defaults:
  - SSC_MT_SE_adLIF
  - /comparison/SSC
  - _self_

exp_name: SSC_MT_consistency
evaluation_protocol: mt_temporal_consistency_v1
paper_baseline_deviations:
  - model_variant=MT_SE_adLIF
  - loss_agg=mean_membrane_potentials (released SSC implementation)
  - training_only_temporal_js_weight=${temporal_consistency.weight}_window=${temporal_consistency.window}
temporal_consistency:
  weight: 0.1
  window: 5
run_test: false
logdir: results/experiments/mt_consistency_v1/SSC/seed_${random_seed}
hydra:
  output_subdir: null
  run:
    dir: ${mt_tc_repo:${logdir}}
  sweep:
    dir: ${mt_tc_repo:results/experiments/mt_consistency_v1/SSC}
    subdir: seed_${random_seed}

# @package _global_
defaults:
  - SSC_SE_adLIF
  - /comparison: SSC
  - _self_

# Separate validation-only diagnostic, not a replacement canonical reference.
exp_name: SSC_SE_adLIF_loss_diagnostic
evaluation_protocol: ssc_loss_diagnostic_v1
loss_agg: mean_membrane_potentials
paper_baseline_deviations:
  - "loss_agg=${loss_agg}"
  - "run_test=false (validation-only diagnostic)"
run_test: false
ckpt_path: null
init_ckpt_path: null
logdir: results/experiments/ssc_loss_diagnostic_v1/${loss_agg}/seed_${random_seed}
hydra:
  run:
    dir: ${logdir}

defaults:
  - _self_
  - experiment: SHD_SE_adLIF_small
  - override hydra/job_logging: none # to disable hydra logging

random_seed: 42

logdir: ./results

datadir: ./data
cachedir: ./data/cache
ckpt_path: null
init_ckpt_path: null # weights-only initialization; optimizer and epoch count start fresh
run_test: true # disable during hyperparameter selection
scheduler: plateau # plateau, constant, cosine
scheduler_min_lr: 0.0
gradient_clip_val: 1.5
device: cuda:0

# Optional validation-based early stopping. Experiment launchers can override
# these values without changing the reference experiment configuration.
early_stopping: false
early_stopping_patience: 50
early_stopping_min_delta: 0.001

hydra:  
  job:
    chdir: true
  run:
    dir: ${logdir}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${logdir}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

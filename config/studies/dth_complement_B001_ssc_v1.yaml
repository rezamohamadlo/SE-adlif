  DTH_RDROP_SE_adLIF: 0
dropout_consistency_alpha:
  DTH_SE_adLIF: 0
  DTH_RDROP_SE_adLIF: 1
spike_deletion:
  DTH_SE_adLIF: 0
  DTH_RDROP_SE_adLIF: 0
